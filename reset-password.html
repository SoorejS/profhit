<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - PROPHIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
    <div class="animated-bg"></div>

    <div class="auth-layout">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <h2>Set New Password</h2>
                <p>Choose a strong password to secure your account.</p>
            </div>

            <form id="resetForm">
                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="newPassword" class="input-control" placeholder="••••••••" required minlength="8">
                        <i class="fa-solid fa-eye password-toggle"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full" style="padding:0.75rem; font-size:1rem; margin-top:1rem;">Save Password</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (!token) {
                window.showToast('Invalid or missing reset token.', 'error');
            }

            // Password toggle visibility
            const toggles = document.querySelectorAll('.password-toggle');
            toggles.forEach(toggle => {
                toggle.addEventListener('click', (e) => {
                    const input = e.target.previousElementSibling;
                    if (input.type === 'password') {
                        input.type = 'text';
                        e.target.classList.replace('fa-eye', 'fa-eye-slash');
                    } else {
                        input.type = 'password';
                        e.target.classList.replace('fa-eye-slash', 'fa-eye');
                    }
                });
            });

            const resetForm = document.getElementById('resetForm');
            if (resetForm) {
                resetForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!token) {
                        window.showToast('Token is missing from URL.', 'error');
                        return;
                    }

                    const btn = resetForm.querySelector('button[type="submit"]');
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...';

                    const newPassword = document.getElementById('newPassword').value;

                    try {
                        await window.ApiClient.post('/auth/reset-password', { token, newPassword });
                        window.showToast('Password reset successfully!', 'success');
                        setTimeout(() => window.location.href = 'login.html', 1500);
                    } catch (err) {
                        window.showToast(err.message, 'error');
                        btn.disabled = false;
                        btn.innerHTML = 'Save Password';
                    }
                });
            }
        });
    </script>
</body>
</html>
