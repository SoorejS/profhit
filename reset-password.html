<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - PROPHIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
    <div class="animated-bg"></div>

    <div class="auth-layout">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <a href="index.html" style="display:inline-block; margin-bottom:1rem; color:var(--color-primary); font-size:2.5rem;"><i class="ph-fill ph-trend-up"></i></a>
                <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem;">Set New Password</h2>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Choose a strong password to secure your account.</p>
            </div>

            <form id="resetForm">
                <div class="input-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-input-wrapper" style="position: relative;">
                        <i class="ph ph-lock-key" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem;"></i>
                        <input type="password" id="newPassword" class="input-control" placeholder="••••••••" style="padding-left: 2.5rem;" required minlength="8">
                        <i class="ph ph-eye password-toggle" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; font-size: 1.2rem;"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full" style="padding:0.85rem; font-size:1.05rem; margin-top:1.5rem; justify-content: center;"><i class="ph-bold ph-floppy-disk"></i> Save Password</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            if (!token) {
                window.showToast('Invalid or missing reset token.', 'error');
            }

            // Password toggle visibility
            const toggles = document.querySelectorAll('.password-toggle');
            toggles.forEach(toggle => {
                toggle.addEventListener('click', (e) => {
                    const input = e.target.previousElementSibling;
                    if (input.type === 'password') {
                        input.type = 'text';
                        e.target.classList.replace('ph-eye', 'ph-eye-slash');
                    } else {
                        input.type = 'password';
                        e.target.classList.replace('ph-eye-slash', 'ph-eye');
                    }
                });
            });

            const resetForm = document.getElementById('resetForm');
            if (resetForm) {
                resetForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    if (!token) {
                        window.showToast('Token is missing from URL.', 'error');
                        return;
                    }

                    const btn = resetForm.querySelector('button[type="submit"]');
                    btn.disabled = true;
                    btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving...';

                    const newPassword = document.getElementById('newPassword').value;

                    try {
                        await window.ApiClient.post('/auth/reset-password', { token, newPassword });
                        window.showToast('Password reset successfully!', 'success');
                        setTimeout(() => window.location.href = 'login.html', 1500);
                    } catch (err) {
                        window.showToast(err.message, 'error');
                        btn.disabled = false;
                        btn.innerHTML = 'Save Password';
                    }
                });
            }
        });
    </script>
</body>
</html>
