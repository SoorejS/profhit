services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: profhit
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a unique DB_PASSWORD}
      POSTGRES_DB: profhit
    volumes:
      - profhit_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profhit -d profhit"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      USE_SQLITE: "false"
      DB_HOST: db
      DB_USER: profhit
      DB_PASSWORD: ${DB_PASSWORD:?Set a unique DB_PASSWORD}
      DB_NAME: profhit
      DB_PORT: "5432"
      DB_SSLMODE: disable # Private Compose network; use TLS for remote databases.
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET of at least 32 characters}
      GIN_MODE: release
      BETA_MODE: "false"
      SEED_DEMO_DATA: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  profhit_pgdata:
