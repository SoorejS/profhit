services:
  - type: web
    name: prophit-api
    env: docker
    region: singapore
    plan: starter
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prophit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: ALLOWED_ORIGINS
        value: https://profhit.vercel.app

databases:
  - name: prophit-db
    databaseName: profhit
    user: prophit_user
    region: singapore
    plan: starter
