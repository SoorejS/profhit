services:
  - type: web
    name: prophit-api
    env: docker
    region: singapore
    plan: starter
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prophit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 8080
      - key: GIN_MODE
        value: release
      - key: ALLOWED_ORIGINS
        value: https://profhit.vercel.app
      - key: APP_URL
        value: https://profhit.vercel.app
      - key: USE_SQLITE
        value: false
      - key: SEED_DEMO_DATA
        value: false
      - key: BETA_MODE
        value: false
      - key: NEWS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: NEWS_PAGE_SIZE
        value: 50
      - key: NEWS_REFRESH_MINUTES
        value: 60
      - key: NEWS_AI_ENABLED
        value: false

databases:
  - name: prophit-db
    databaseName: profhit
    user: prophit_user
    region: singapore
    plan: starter
