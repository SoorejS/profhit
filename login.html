<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - PROPHIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>
    <div class="animated-bg"></div>

    <div class="auth-layout">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <a href="index.html" style="display:inline-block; margin-bottom:1rem; color:var(--color-primary); font-size:2rem;"><i class="fa-solid fa-chart-line"></i></a>
                <h2>Welcome Back</h2>
                <p>Log in to access your predictions and portfolio.</p>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="input-control" placeholder="you@example.com" required>
                </div>

                <div class="input-group">
                    <div class="flex justify-between w-full">
                        <label for="password">Password</label>
                        <a href="forgot-password.html" style="font-size:0.85rem;">Forgot password?</a>
                    </div>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" class="input-control" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye password-toggle"></i>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-full" style="padding:0.75rem; font-size:1rem; margin-top:1rem;">Log In</button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register.html">Sign up</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
