<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - PROPHIT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/pages/auth.css">

</head>
<body>
    <div class="animated-bg"></div>

    <div class="auth-layout">
        <div class="auth-card glass-panel">
            <div class="auth-header">
                <a href="index.html" style="display:inline-block; margin-bottom:1rem; color:var(--color-primary); font-size:2.5rem;"><i class="ph-fill ph-trend-up"></i></a>
                <h2 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem;">Welcome Back</h2>
                <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">Log in to access your predictions and portfolio.</p>
            </div>

            <!-- Google Sign In Button Container -->
            <div id="googleSignIn"><p class="text-sm text-muted">Checking Google Sign-In availability...</p></div>

            <div style="display: flex; align-items: center; margin: 1.25rem 0; color: var(--text-muted); font-size: 0.85rem;">
                <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
                <span style="padding: 0 10px;">or continue with email</span>
                <div style="flex: 1; height: 1px; background: var(--border-subtle);"></div>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <div style="position: relative;">
                        <i class="ph ph-envelope-simple" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem;"></i>
                        <input type="email" id="email" class="input-control" placeholder="you@example.com" style="padding-left: 2.5rem;" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="flex justify-between w-full" style="margin-bottom: 0.25rem;">
                        <label for="password">Password</label>
                        <a href="forgot-password.html" style="font-size:0.85rem; color: var(--color-primary);">Forgot password?</a>
                    </div>
                    <div class="password-input-wrapper" style="position: relative;">
                        <i class="ph ph-lock-key" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem;"></i>
                        <input type="password" id="password" class="input-control" placeholder="••••••••" style="padding-left: 2.5rem;" required>
                        <button type="button" aria-label="Show or hide password" class="ph ph-eye password-toggle" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); cursor: pointer; font-size: 1.2rem;"></button>
                    </div>
                </div>

                <div class="input-group hidden" id="twoFactorGroup"><label for="twoFactorCode">Authenticator code</label><input id="twoFactorCode" class="input-control" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" aria-describedby="twoFactorHelp"><p id="twoFactorHelp" class="text-xs text-muted mt-2">Enter the current 6-digit code from your authenticator app.</p></div>
                <button type="submit" class="btn btn-primary w-full" style="padding:0.85rem; font-size:1.05rem; margin-top:1.5rem; justify-content: center;"><i class="ph-bold ph-sign-in"></i> Log In</button>
                <button type="button" id="verifyGoogleTwoFactor" class="btn btn-outline w-full hidden" style="margin-top:0.75rem; justify-content:center;">Verify Google sign-in</button>
            </form>

            <div class="auth-footer" style="margin-top: 2rem; text-align: center; font-size: 0.95rem; color: var(--text-secondary);">
                Don't have an account? <a href="register.html" style="font-weight: 500;">Sign up</a>
            </div>
        </div>
    </div>

    <script type="module" src="js/pages/auth.js"></script>
</body>
</html>
