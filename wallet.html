<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet & Identity - PROPHIT</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/pages/dashboard.css">
    <style>
        .wallet-header {
            background: linear-gradient(135deg, rgba(212,175,55,0.15) 0%, rgba(139,92,246,0.1) 100%);
            padding: var(--spacing-8) var(--spacing-10);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-subtle);
            margin-bottom: var(--spacing-6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .balance-huge {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-4) 0;
            border-bottom: 1px solid var(--border-subtle);
        }
        .transaction-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <app-sidebar active="wallet"></app-sidebar>

        <main class="main-content">
            <app-topbar></app-topbar>

            <div class="content-wrapper scroll-y">
                
                <div class="single-column-grid">
                    
                    <div class="wallet-header">
                        <div>
                            <div class="text-secondary font-semibold" style="margin-bottom: var(--spacing-2); text-transform: uppercase; letter-spacing: 0.08em; font-size: 0.9rem;">Total Balance</div>
                            <div class="balance-huge"><i class="ph-fill ph-coins text-gold"></i> <span id="walletBalance">--</span></div>
                            <div class="text-muted" style="margin-top: var(--spacing-2); font-size: 0.95rem;">1 PTS = ₹1 (Play Money)</div>
                        </div>
                        <div class="flex flex-col gap-3">
                            <button class="btn btn-primary" onclick="openDeposit()" style="padding: 0.8rem 1.5rem; font-size: 1.05rem;"><i class="ph-bold ph-plus"></i> Deposit Funds</button>
                            <button class="btn btn-outline" onclick="openWithdraw()" style="padding: 0.8rem 1.5rem; font-size: 1.05rem;"><i class="ph-bold ph-arrows-left-right"></i> Redeem / Withdraw</button>
                        </div>
                    </div>

                    <div class="dashboard-grid">
                        
                        <!-- Left Col: Transactions -->
                        <div>
                            <div class="card" style="border: 1px solid var(--border-subtle);">
                                <div class="flex justify-between items-center" style="margin-bottom: var(--spacing-4);">
                                    <h3 style="margin: 0; font-size: 1.25rem; font-weight: 700;">Transaction Ledger</h3>
                                    <button class="btn btn-outline" style="padding: 0.4rem 0.6rem; font-size: 1rem; border-radius: var(--radius-md);" onclick="loadLedger()"><i class="ph-bold ph-arrows-clockwise"></i></button>
                                </div>
                                <div id="ledgerList">
                                    <div class="text-muted text-center" style="padding: var(--spacing-6);"><i class="ph ph-spinner ph-spin" style="margin-right: 8px;"></i> Loading transactions...</div>
                                </div>
                            </div>

                            <!-- Rewards moved to dedicated page -->
                        </div>

                        <!-- Right Col: KYC & Identity -->
                        <aside class="right-sidebar">
                            <div class="card" style="border: 1px solid var(--border-subtle);">
                                <h3 style="margin-bottom: var(--spacing-4); font-size: 1.1rem; font-weight: 600;"><i class="ph-fill ph-shield-check text-primary"></i> Identity Verification</h3>
                                
                                <div id="kycStatusContainer" style="text-align: center; padding: var(--spacing-6) 0;">
                                    <div id="kycIcon" style="font-size: 3.5rem; margin-bottom: var(--spacing-3); color: var(--text-muted);"><i class="ph-fill ph-question"></i></div>
                                    <h4 id="kycStatusText" style="margin-bottom: var(--spacing-5); font-size: 1.2rem;">Unverified</h4>
                                    
                                    <button id="kycBtn" class="btn btn-primary w-full" onclick="startKyc()">Start HyperVerge KYC</button>
                                </div>
                                
                                <div class="text-muted" style="font-size: 0.85rem; margin-top: var(--spacing-4); text-align: center; padding-top: var(--spacing-4); border-top: 1px solid var(--border-subtle);">
                                    <i class="ph-fill ph-lock-key"></i> Secured by HyperVerge
                                </div>
                            </div>
                        </aside>

                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Deposit Modal -->
    <div id="depositModal" class="hidden" style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px);">
        <div class="card" style="width: 400px; max-width: 90vw; border: 1px solid var(--border-strong); box-shadow: var(--shadow-xl);">
            <div class="flex justify-between items-center" style="margin-bottom: var(--spacing-6);">
                <h3 style="font-size: 1.25rem; font-weight: 700;">Deposit Funds</h3>
                <i class="ph-bold ph-x" style="cursor: pointer; font-size: 1.2rem; color: var(--text-muted);" onclick="document.getElementById('depositModal').classList.add('hidden')"></i>
            </div>
            <div class="input-group" style="margin-bottom: var(--spacing-6);">
                <label style="font-weight: 500;">Amount to Deposit (INR)</label>
                <div style="position: relative;">
                    <i class="ph ph-currency-inr" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 1.2rem;"></i>
                    <input type="number" id="depositAmount" class="input-control" placeholder="1000" style="padding-left: 2.5rem; font-size: 1.1rem; font-weight: 600;">
                </div>
            </div>
            <button class="btn btn-primary w-full" onclick="processDeposit()" style="padding: 1rem; font-size: 1.05rem;">Proceed to Razorpay</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="js/pages/wallet.js"></script>
</body>
</html>
