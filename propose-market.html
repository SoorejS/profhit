<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Propose Market - PROPHIT</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/phosphor/regular.css">
    <link rel="stylesheet" href="assets/phosphor/bold.css">
    <link rel="stylesheet" href="assets/phosphor/fill.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/propose-market.css">
</head>
<body>
    <div class="app-layout">
        <app-sidebar active="propose"></app-sidebar>

        <main class="main-content">
            <app-topbar></app-topbar>

            <div class="content-wrapper scroll-y">
                
                <div class="single-column-grid proposal-layout">
                    
                    <div style="margin-bottom: var(--spacing-6); text-align: center;">
                        <h1 style="font-size: 2.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--color-primary);"><i class="ph-fill ph-lightbulb"></i> Propose a Market</h1>
                        <p class="text-muted" style="font-size: 1.1rem; margin-top: 4px;">Got a great idea for a prediction market? Submit it for admin review!</p>
                    </div>

                    <div class="card proposal-card">
                        <form id="proposeForm" onsubmit="submitProposal(event)">
                            <div class="input-group" style="margin-bottom: var(--spacing-5);">
                                <label for="pTitle" style="font-weight: 600;">Market Title <span class="text-danger">*</span></label>
                                <input type="text" id="pTitle" class="input-control" placeholder="e.g. Will Bitcoin cross $100k before December 2026?" required>
                            </div>
                            
                            <div class="input-group" style="margin-bottom: var(--spacing-5);">
                                <label for="pCategory" style="font-weight: 600;">Category <span class="text-danger">*</span></label>
                                <select id="pCategory" class="input-control" required>
                                    <option value="Financial Markets">Financial Markets</option>
                                    <option value="Sports">Sports</option>
                                    <option value="Politics">Politics</option>
                                    <option value="Geopolitics">Geopolitics</option>
                                    <option value="Technology">Technology</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Weather">Weather</option>
                                    <option value="Wild Card">Wild Card</option>
                                </select>
                            </div>
                            
                            <div class="input-group" style="margin-bottom: var(--spacing-5);">
                                <label for="pDescription" style="font-weight: 600;">Description & Resolution Criteria <span class="text-danger">*</span></label>
                                <textarea id="pDescription" class="input-control" rows="4" placeholder="Explain exactly how and when this market resolves..." required></textarea>
                            </div>
                            
                            <div class="input-group" style="margin-bottom: var(--spacing-5);">
                                <label for="pDifficulty">Difficulty</label><select id="pDifficulty" class="input-control"><option>Easy</option><option>Medium</option><option>Hard</option></select>
<label for="pOptions">Named options / nominees (JSON array)</label><input id="pOptions" class="input-control" value='["Yes","No"]' required>
<label for="pRangeWidth">Maximum interval width for range questions</label><input id="pRangeWidth" type="number" min="0" step="any" value="0" class="input-control">
<p id="predictionFormat" class="text-muted"></p>
<label for="pSource" style="font-weight: 600;">Official Resolution Source <span class="text-danger">*</span></label>
                                <input type="url" id="pSource" class="input-control" placeholder="https://example.com/official-data" required>
                            </div>
                            
                            <div class="input-group" style="margin-bottom: var(--spacing-5);">
                                <label for="pLockTime" style="font-weight: 600;">Lock Time (When to stop predictions) <span class="text-danger">*</span></label>
                                <input type="datetime-local" id="pLockTime" class="input-control" required>
                            </div>
                            
                            <p class="text-muted">All six categories support their published answer formats. Outcomes must be measurable and sourced.</p>
                            <button id="submitBtn" type="submit" class="btn btn-primary w-full">Submit Proposal for Review</button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/pages/propose-market.js"></script>
</body>
</html>
