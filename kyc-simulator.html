<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperVerge Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --primary: #8b5cf6;
            --text: #fafafa;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #27272a;
        }
        button {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-success { background-color: var(--primary); color: white; }
        .btn-reject { background-color: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>HyperVerge Simulator</h2>
        <p>You have been redirected to the hosted KYC page.</p>
        <p style="font-size: 0.9rem; color: #a1a1aa;">Transaction ID: <span id="txnId"></span></p>
        
        <button class="btn-success" onclick="simulateWebhook('auto_approved')">Simulate Successful KYC</button>
        <button class="btn-reject" onclick="simulateWebhook('rejected')">Simulate Rejected KYC</button>
        <div id="status" style="margin-top: 1rem; font-size: 0.9rem;"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const transactionId = urlParams.get('transactionId');
        document.getElementById('txnId').textContent = transactionId;

        async function simulateWebhook(status) {
            const btn = event.target;
            btn.textContent = 'Simulating...';
            btn.disabled = true;

            const payload = {
                transactionId: transactionId,
                status: status,
                details: {
                    panMasked: "ABCDE****F",
                    aadhaarLast4: "1234",
                    fullName: "John Doe",
                    dob: "1990-01-01",
                    matchScore: 99.5,
                    livenessScore: 98.2
                },
                reason: status === 'rejected' ? 'Face mismatch detected' : ''
            };

            // In a real scenario, this HMAC signature is generated by HyperVerge's private key.
            // For the simulator, we generate a valid one based on the DEV secret to test the backend logic.
            // Since we can't securely sign this on the client side without exposing the secret, 
            // we will hit a dedicated simulator-signer endpoint OR we can just use a hardcoded DEV secret if we load a crypto library.
            // However, to keep it simple, we will send this directly to the webhook, and the backend verifies it. 
            // Wait, we need to generate the HMAC to pass the backend validation!
            
            // To pass backend validation during simulation without exposing the secret on frontend,
            // we will create a quick backend endpoint just for simulation signing, or we do it here if we expose the secret.
            // For this simulator ONLY, we will fetch the signature from a helper endpoint we'll create right now.
            try {
                const signRes = await fetch('/api/simulator/sign-webhook', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const { signature } = await signRes.json();

                const res = await fetch('/api/webhooks/hyperverge', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-hyperverge-signature': signature
                    },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    document.getElementById('status').textContent = 'Webhook sent successfully! Redirecting back...';
                    setTimeout(() => window.location.href = '/', 2000);
                } else {
                    document.getElementById('status').textContent = 'Webhook failed.';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status').textContent = 'Error connecting to backend.';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
