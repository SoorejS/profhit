<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperVerge Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #18181b;
            --primary: #8b5cf6;
            --text: #fafafa;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #27272a;
        }
        button {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-success { background-color: var(--primary); color: white; }
        .btn-reject { background-color: #ef4444; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <h2>HyperVerge Simulator</h2>
        <p>Development tool only. Requires a local super-admin session and BETA_MODE. This is not real identity verification.</p>
        <p style="font-size: 0.9rem; color: #a1a1aa;">Transaction ID: <span id="txnId"></span></p>
        
        <button class="btn-success" onclick="simulateWebhook('auto_approved', this)">Simulate Successful KYC</button>
        <button class="btn-reject" onclick="simulateWebhook('rejected', this)">Simulate Rejected KYC</button>
        <div id="status" style="margin-top: 1rem; font-size: 0.9rem;"></div>
    </div>

    <script type="module">
        import ApiClient from "./js/api/client.js";
        const urlParams = new URLSearchParams(window.location.search);
        const transactionId = urlParams.get('transactionId');
        document.getElementById('txnId').textContent = transactionId;

        window.simulateWebhook = async function(status, btn) {
            btn.textContent = 'Simulating...';
            btn.disabled = true;

            const payload = {
                transactionId: transactionId,
                status: status,
                details: {
                    panMasked: "ABCDE****F",
                    aadhaarLast4: "1234",
                    fullName: "John Doe",
                    dob: "1990-01-01",
                    matchScore: 99.5,
                    livenessScore: 98.2
                },
                reason: status === 'rejected' ? 'Face mismatch detected' : ''
            };

            try {
                const {signature} = await ApiClient.post('/simulator/sign-webhook', payload);

                await ApiClient.post('/webhooks/hyperverge', payload, {headers: {'x-hyperverge-signature':signature}});
                {
                    document.getElementById('status').textContent = 'Webhook sent successfully! Redirecting back...';
                    setTimeout(() => window.location.href = '/', 2000);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status').textContent = err.message;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
