<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rewards Center - PROPHIT</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
    <div class="app-layout">
        <app-sidebar active="rewards"></app-sidebar>

        <main class="main-content">
            <app-topbar></app-topbar>

            <div class="content-wrapper scroll-y">
                
                <div class="single-column-grid">
                    
                    <div style="margin-bottom: var(--spacing-6);">
                        <h1 style="font-size: 2.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--color-gold);"><i class="ph-fill ph-gift"></i> Redemption Center</h1>
                        <p class="text-muted" style="font-size: 1.1rem; margin-top: 4px;">Exchange your winning PTS for real-world rewards and vouchers.</p>
                    </div>

                    <div class="dashboard-grid">
                        <!-- Left Col: Rewards Catalog -->
                        <div>
                            <div class="card" style="border: 1px solid var(--border-subtle);">
                                <h3 style="margin-bottom: var(--spacing-4); font-size: 1.25rem; font-weight: 700;">Available Rewards</h3>
                                <div id="catalogList" class="markets-grid" style="grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));">
                                    <div class="text-muted text-center" style="padding: var(--spacing-6); grid-column: 1 / -1;"><i class="ph ph-spinner ph-spin" style="margin-right: 8px;"></i> Loading catalog...</div>
                                </div>
                            </div>
                        </div>

                        <!-- Right Col: Redemption History -->
                        <aside class="right-sidebar">
                            <div class="card" style="border: 1px solid var(--border-subtle);">
                                <h3 style="margin-bottom: var(--spacing-4); font-size: 1.1rem; font-weight: 600;"><i class="ph-fill ph-clock-counter-clockwise text-primary"></i> Redemption History</h3>
                                <div id="historyList">
                                    <div class="text-muted text-center" style="padding: var(--spacing-6);"><i class="ph ph-spinner ph-spin" style="margin-right: 8px;"></i> Loading history...</div>
                                </div>
                            </div>
                        </aside>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/pages/rewards.js"></script>
</body>
</html>
