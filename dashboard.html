<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PROPHIT</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/phosphor/regular.css">
    <link rel="stylesheet" href="assets/phosphor/bold.css">
    <link rel="stylesheet" href="assets/phosphor/fill.css">
    
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <link rel="stylesheet" href="css/live-feed.css">
    <link rel="stylesheet" href="css/pages/dashboard.css">
</head>
<body>
    <div class="app-layout">
        <!-- Reusable Web Component for Sidebar -->
        <app-sidebar active="home"></app-sidebar>

        <main class="main-content">
            <!-- Reusable Web Component for Top Navigation -->
            <app-topbar></app-topbar>

            <div class="content-wrapper scroll-y">
                
                <div class="dashboard-grid">
                    <!-- Left: Main Markets Feed -->
                    <div class="markets-feed">
                        <section id="liveFeed" aria-label="Current news predictions"></section>
                        <div id="legacyFeedControls" class="flex justify-between items-center" style="margin-bottom: var(--spacing-6);">
                            <h2 id="categoryTitle" style="font-weight: 700; font-size: 1.5rem; letter-spacing: -0.02em;">Live Markets</h2>
                            <div class="flex gap-2">
                                <button data-sort="trending" aria-pressed="true" class="btn btn-secondary" style="border-radius: var(--radius-full);"><i class="ph-fill ph-fire text-gold"></i> Trending</button>
                                <button class="btn btn-outline" style="border-radius: var(--radius-full);" data-sort="newest" aria-pressed="false">New</button>
                                <button class="btn btn-outline" style="border-radius: var(--radius-full);" data-sort="ending_soon" aria-pressed="false">Closing Soon</button>
                            </div>
                        </div>

                        <div id="marketsContainer" class="markets-grid">
                            <!-- Skeletons shown during load -->
                            <div class="card skeleton" style="height: 200px;"></div>
                            <div class="card skeleton" style="height: 200px;"></div>
                            
                            <!-- Sponsored predictions are planned; live cards come from the API. -->
                        </div>
                    </div>

                    <!-- Right: Trending / Info Sidebar -->
                    <aside class="right-sidebar">
                        
                        <div class="card" style="background: linear-gradient(135deg, rgba(212,175,55,0.1) 0%, rgba(139,92,246,0.1) 100%); border: 1px solid var(--color-gold);">
                            <h3 style="font-size: 1.1rem; color: var(--color-gold); margin-bottom: var(--spacing-2); font-weight: 600;"><i class="ph-fill ph-gift"></i> Daily Rewards</h3>
                            <div class="flex justify-between items-center" style="margin-bottom: var(--spacing-5);">
                                <span class="text-sm" style="color: var(--text-secondary);">Prediction streak:</span>
                                <span class="badge badge-gold"><span id="streakCount">--</span> Days</span>
                            </div>
                            <button class="btn btn-primary w-full" id="claimDailyBtn" onclick="claimDailyReward()">Daily login: 10 coins</button>
                        </div>

                        <div class="card" style="border: 1px solid var(--border-subtle); background: var(--bg-surface-elevated);">
                            <h3 style="font-size: 1.1rem; margin-bottom: var(--spacing-4); font-weight: 600;"><i class="ph-fill ph-lightning text-gold"></i> Fast Movers</h3>
                            <div id="trendingContainer">
                                <div class="skeleton skeleton-text"></div>
                                <div class="skeleton skeleton-text"></div>
                                <div class="skeleton skeleton-text"></div>
                            </div>
                        </div>
                        
                        <div class="card" style="border: 1px solid var(--border-subtle); background: var(--bg-surface-elevated);">
                            <h3 style="font-size: 1.1rem; margin-bottom: var(--spacing-4); font-weight: 600;"><i class="ph-fill ph-newspaper text-primary"></i> Trending News</h3>
                            <div id="newsContainer" class="flex flex-col gap-3">
                                <div class="skeleton skeleton-text"></div>
                                <div class="skeleton skeleton-text"></div>
                                <div class="skeleton skeleton-text"></div>
                            </div>
                        </div>
                        
                        <div class="card" style="background: var(--color-primary-light); border: 1px solid var(--color-primary);">
                            <h3 style="font-size: 1.1rem; color: #c4b5fd; font-weight: 600; margin-bottom: var(--spacing-2);">Join the Community</h3>
                            <p style="font-size: 0.9rem; color: #a78bfa; margin-bottom: var(--spacing-5); line-height: 1.5;">Discuss strategies, propose markets, and chat with top forecasters.</p>
                            <p class="text-sm">Discord community: coming soon. Discuss each market in its comments.</p>
                        </div>
                    </aside>
                </div>
                
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
