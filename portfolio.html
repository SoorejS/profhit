<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - PROPHIT</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
    <style>
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-4);
            margin-bottom: var(--spacing-6);
        }
        .stat-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: var(--spacing-6);
            text-align: center;
        }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--color-primary);
            margin-bottom: var(--spacing-2);
        }
        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <app-sidebar active="portfolio"></app-sidebar>

        <main class="main-content">
            <app-topbar></app-topbar>

            <div class="content-wrapper scroll-y">
                
                <div class="single-column-grid">
                    
                    <div style="margin-bottom: var(--spacing-6);">
                        <h1 style="font-size: 2.25rem; font-weight: 700; letter-spacing: -0.02em;">My Portfolio</h1>
                        <p class="text-muted" style="font-size: 1.1rem; margin-top: 4px;">Track your investments, active predictions, and historical win rates.</p>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-card" style="background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle);">
                            <div class="stat-value" id="statWinRate">--%</div>
                            <div class="stat-label">Win Rate</div>
                        </div>
                        <div class="stat-card" style="background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle);">
                            <div class="stat-value" id="statMarketsJoined">--</div>
                            <div class="stat-label">Markets Joined</div>
                        </div>
                        <div class="stat-card" style="background: var(--bg-surface-elevated); border: 1px solid var(--border-subtle);">
                            <div class="stat-value text-gold" id="statTotalPayout">-- PTS</div>
                            <div class="stat-label">Total Potential Payout</div>
                        </div>
                    </div>

                    <div class="card" style="border: 1px solid var(--border-subtle);">
                        <div class="flex justify-between items-center" style="margin-bottom: var(--spacing-4);">
                            <h3 style="font-size: 1.25rem; font-weight: 700;">Your Predictions</h3>
                        </div>
                        <div id="portfolioList">
                            <div class="text-muted text-center" style="padding: var(--spacing-6);"><i class="ph ph-spinner ph-spin" style="margin-right: 8px;"></i> Loading portfolio...</div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/pages/portfolio.js"></script>
</body>
</html>
