<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - PROPHIT</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
    <div class="app-layout">
        <app-sidebar active="notifications"></app-sidebar>

        <main class="main-content">
            <app-topbar></app-topbar>

            <div class="content-wrapper scroll-y">
                <div class="single-column-grid" style="max-width: 800px; margin: 0 auto;">
                    
                    <div class="flex justify-between items-center" style="margin-bottom: var(--spacing-6);">
                        <div>
                            <h1 style="font-size: 2.25rem; font-weight: 700; letter-spacing: -0.02em; color: var(--color-primary);"><i class="ph-fill ph-bell"></i> Notifications</h1>
                            <p class="text-muted" style="font-size: 1.1rem; margin-top: 4px;">Coin expiry reminders, prediction wins and voucher updates saved to your account.</p>
                        </div>
                        <button class="btn btn-outline" id="markRead">Mark all as read</button>
                    </div>

                    <div class="card" style="border: 1px solid var(--border-subtle); padding: 0;">
                        <!-- Tabs -->
                        <div style="display: flex; gap: var(--spacing-4); padding: var(--spacing-4); border-bottom: 1px solid var(--border-subtle);">
                            <button id="showAll" class="btn btn-primary" style="padding: 0.5rem 1rem;">All</button>
                            <button class="btn btn-outline" style="padding: 0.5rem 1rem;" id="showUnread">Unread <span class="badge badge-primary" id="unreadCount" style="margin-left: 4px;">0</span></button>
                        </div>

                        <!-- Content List -->
                        <div id="notificationList" style="padding: var(--spacing-6);">
                            <p role="status">Loading notifications...</p>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/pages/notifications.js"></script>
</body>
</html>
