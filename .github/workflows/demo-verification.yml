name: Demo verification

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start disposable PostgreSQL
        shell: bash
        run: |
          audit_password=$(openssl rand -hex 24)
          echo "::add-mask::$audit_password"
          audit_dsn="postgres://profhit:$audit_password@127.0.0.1:15432/profhit?sslmode=disable"
          echo "::add-mask::$audit_dsn"
          echo "TEST_POSTGRES_DSN=$audit_dsn" >> "$GITHUB_ENV"
          docker run --detach --name profhit-audit-postgres \
            --publish 127.0.0.1:15432:5432 \
            --env POSTGRES_USER=profhit --env POSTGRES_DB=profhit \
            --env POSTGRES_PASSWORD="$audit_password" postgres:18-alpine
          for attempt in $(seq 1 30); do
            if docker exec profhit-audit-postgres pg_isready -U profhit -d profhit; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify formatting, modules, build, and vet
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          go vet ./...
          go build ./...
      - name: Race and PostgreSQL integration tests
        working-directory: backend
        env:
          CGO_ENABLED: '1'
          REQUIRE_POSTGRES_TESTS: 'true'
        run: go test -race -count=1 ./...
      - name: Frontend and patch checks
        run: |
          node scripts/check-frontend.mjs
          git diff --check
      - name: Build production container
        run: docker build --tag profhit-audit:${{ github.sha }} .
      - name: Remove disposable container
        if: always()
        run: docker rm --force profhit-audit-postgres || true
